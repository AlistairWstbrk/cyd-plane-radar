; CYD Plane Radar
; ESP32-2432S028R "Cheap Yellow Display" (2.8" 320x240, XPT2046 resistive touch)
;
;   env:cyd       - original CYD, ILI9341 panel (single micro-USB)       [default]
;   env:cyd2usb   - "CYD2USB" variant, ST7789 panel (micro-USB + USB-C)
;
; If colours look inverted on your board, try the other env.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.embed_files =
  data/font_xs.vlw
  data/font_s.vlw
  data/font_m.vlw
  data/font_l.vlw
  data/font_xl.vlw
extra_scripts = post:scripts/merge_firmware.py

build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:cyd]
build_flags =
  ${env.build_flags}
  -DCYD_PANEL_ILI9341=1

[env:cyd2usb]
build_flags =
  ${env.build_flags}
  -DCYD_PANEL_ST7789=1
